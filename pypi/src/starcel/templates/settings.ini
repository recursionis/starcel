# Starcel launch settings — edit and save.
#
# Any line starting with # or ; is ignored.
# Precedence: CLI flags > this file > package defaults.
# Run `starcel config show` to see the effective merged values at any time.
# Run `starcel run --dry-run` to see the exact command-line that would be passed to UE4.

[client]
# server_host   = 192.168.1.20:7827      ; first positional UE arg; leave commented for standalone
# res_x         = 1600
# res_y         = 900
# windowed      = true
# fullscreen    = false
# console       = true                   ; -Console
# log           = true                   ; -log
# stdout        = true                   ; -stdout
# full_stdout   = true                   ; -FullStdOutLogOutput
# unattended    = false                  ; -unattended
# nullrhi       = false                  ; -nullrhi (headless; no GPU)
# nosound       = false                  ; -nosound
# exec_cmds     =                        ; -ExecCmds="cmd1;cmd2"
# log_cmds      =                        ; -LogCmds="LogNet Verbose,LogTemp Warning"
# abs_log       =                        ; -ABSLOG="C:/Your/Custom/Path/LogName.txt" (custom absolute log file path)
# ini_overrides =                        ; comma-separated, e.g. -ini:Engine:[/Script/Engine.GameSession]MaxPlayers=64
# extra_args    =                        ; space-separated free-form passthrough

[server]
# port            = 7827
# log             = true
# windowed        = true
# console         = true
# nullrhi         = true
# useperfcounters = true                 ; -useperfcounters
# unattended      = true
# exec_cmds       =
# log_cmds        =
# abs_log         =                      ; -ABSLOG="C:/Your/Custom/Path/LogName.txt" (custom absolute log file path)
# ini_overrides   =
# extra_args      =

[editor]
# abs_log       =                        ; -ABSLOG="C:/Your/Custom/Path/LogName.txt" (custom absolute log file path)
# extra_args    =
